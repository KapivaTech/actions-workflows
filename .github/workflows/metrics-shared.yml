name: Co-authored Commits Report

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests

      - name: Generate report and send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 << 'PYSCRIPT'
          import subprocess, requests, os, re
          from collections import defaultdict
          from datetime import datetime
          import time

          CHUNK_SIZE = 40
          DAYS = 7
          webhook = os.getenv('SLACK_WEBHOOK_URL', '')
          if not webhook:
              print("SLACK_WEBHOOK_URL not set")
              exit(0)

          # Only last 7 days, null byte separator for multi-line body
          raw = subprocess.check_output(
              ["git", "log", "--all", f"--since={DAYS} days ago", "--format=%x00%an%x01%ae%x01%B"],
              text=True
          )

          pr_raw = subprocess.check_output(
              ["git", "log", "--all", f"--since={DAYS} days ago", "--format=%x00%an%x01%ae%x01%s"],
              text=True
          )

          # email -> canonical name + stats
          # We deduplicate by using the FIRST real email seen as the key
          # and map all aliases to it
          email_to_name = {}
          email_stats = defaultdict(lambda: {"total": 0, "co_authored": 0, "prs": 0})

          SKIP = ['dependabot[bot]', 'github-actions[bot]', 'coderabbitai[bot]', 'cursor']

          def canonical_email(email):
              # noreply emails are unreliable - treat as unknown
              if "noreply" in email or "localhost" in email or ".local" in email or ".lan" in email:
                  return None
              return email.lower().strip()

          # Parse commits
          for entry in raw.split("\x00"):
              entry = entry.strip()
              if not entry:
                  continue
              parts = entry.split("\x01", 2)
              if len(parts) < 3:
                  continue
              author, email, body = parts[0].strip(), parts[1].strip(), parts[2]
              if not author or any(s.lower() in author.lower() for s in SKIP):
                  continue

              key = canonical_email(email)
              if not key:
                  # Fall back to author name as key for noreply users
                  key = f"__name__{author.lower()}"

              if key not in email_to_name:
                  email_to_name[key] = {"name": author, "email": email}

              email_stats[key]["total"] += 1

              if re.search(r"co-authored-by", body, re.IGNORECASE):
                  email_stats[key]["co_authored"] += 1

          # Parse PRs
          for entry in pr_raw.split("\x00"):
              entry = entry.strip()
              if not entry:
                  continue
              parts = entry.split("\x01", 2)
              if len(parts) < 3:
                  continue
              author, email, subject = parts[0].strip(), parts[1].strip(), parts[2].strip()
              if not author or any(s.lower() in author.lower() for s in SKIP):
                  continue

              key = canonical_email(email)
              if not key:
                  key = f"__name__{author.lower()}"

              if "merge pull request" in subject.lower():
                  email_stats[key]["prs"] += 1

          total_commits = sum(s["total"] for s in email_stats.values())
          total_co_authored = sum(s["co_authored"] for s in email_stats.values())

          sorted_eng = sorted(email_stats.items(), key=lambda x: x[1]["co_authored"], reverse=True)

          def level(pct):
              if pct >= 80: return "🔥 Expert"
              if pct >= 60: return "⭐ Advanced"
              if pct >= 40: return "📈 Proficient"
              if pct >= 20: return "🌱 Learning"
              return "👋 New"

          def send(blocks):
              r = requests.post(webhook, json={"blocks": blocks}, timeout=10)
              return r.status_code == 200

          overall_pct = round(total_co_authored * 100 / total_commits, 1) if total_commits else 0
          team_status = "🎯 Excellent" if overall_pct >= 20 else "📈 Good" if overall_pct >= 10 else "⚠️ Ramping"
          week_of = f"{datetime.now().strftime('%Y-%m-%d')} (last {DAYS} days)"

          for i in range(0, len(sorted_eng), CHUNK_SIZE):
              chunk = sorted_eng[i:i + CHUNK_SIZE]
              blocks = []

              if i == 0:
                  blocks.append({"type": "header", "text": {"type": "plain_text", "text": "📊 Claude Code Adoption Report"}})
                  blocks.append({
                      "type": "section",
                      "fields": [
                          {"type": "mrkdwn", "text": f"*Team Status*\n{team_status}"},
                          {"type": "mrkdwn", "text": f"*Overall Adoption*\n{overall_pct}%"},
                          {"type": "mrkdwn", "text": f"*Total Commits*\n{total_commits}"},
                          {"type": "mrkdwn", "text": f"*Active Engineers*\n{len(sorted_eng)}"}
                      ]
                  })
                  blocks.append({"type": "context", "elements": [{"type": "mrkdwn", "text": f"📅 {week_of}"}]})
                  blocks.append({"type": "divider"})

              for key, stats in chunk:
                  info = email_to_name.get(key, {"name": key, "email": ""})
                  name = info["name"]
                  email = info["email"] if ("noreply" not in info["email"] and ".local" not in info["email"] and ".lan" not in info["email"]) else ""
                  
                  pct = round(stats["co_authored"] * 100 / stats["total"], 1) if stats["total"] else 0
                  adoption = level(pct)
                  avg_per_day = round(stats["total"] / DAYS, 1)
                  co_auth_str = f"{stats['co_authored']}/{stats['total']} ({pct}%)"

                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": (
                              f"*{name}*\n"
                              f"Email: {email or 'N/A'}\n"
                              f"Adoption Level: {adoption}\n"
                              f"*Metrics:*\n"
                              f"• Total Commits: {stats['total']}\n"
                              f"• Claude Co-authored: {co_auth_str}\n"
                              f"• PRs Merged: {stats['prs']}\n"
                              f"• Avg Commits/Day: {avg_per_day}"
                          )
                      }
                  })
                  blocks.append({"type": "divider"})

              blocks.append({"type": "context", "elements": [{"type": "mrkdwn", "text": f"Updated: {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}"}]})
              send(blocks)
              time.sleep(0.5)

          print(f"✅ Done: {len(sorted_eng)} engineers, {overall_pct}% adoption")
          PYSCRIPT
