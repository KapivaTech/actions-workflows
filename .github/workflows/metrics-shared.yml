name: Co-authored Commits Report

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Debug - Check commit formats
        run: |
          echo "=== Sample commits with Claude ==="
          git log --all --pretty=format:"%B" | grep -i "claude" | head -5
          echo ""
          echo "=== Count matches ==="
          echo "Pattern 'co-authored-by':"
          git log --all --pretty=format:"%B" | grep -c -i "co-authored-by" || echo "0"
      
      - name: Generate report and send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 << 'PYSCRIPT'
          import subprocess
          import requests
          from collections import defaultdict
          import time
          import re
          import os

          CHUNK_SIZE = 40

          webhook = os.getenv('SLACK_WEBHOOK_URL', '')
          if not webhook:
              print("⚠️ SLACK_WEBHOOK_URL not set, skipping Slack post")
              exit(0)

          try:
              log = subprocess.check_output(
                  ["git", "log", "--all", "--pretty=format:%H|||%an|||%ae|||%B"],
                  text=True
              )
          except:
              print("Error fetching git log")
              exit(1)

          commits = [c for c in log.strip().split("\n") if c]
          engineers = defaultdict(lambda: {"total": 0, "co_authored": 0})
          total_commits = 0
          total_co_authored = 0
          
          # Debug
          sample_matches = []

          for entry in commits:
              parts = entry.split("|||", 3)
              if len(parts) < 4:
                  continue
              
              _, author, email, message = parts
              key = f"{author}|||{email}"
              
              engineers[key]["total"] += 1
              total_commits += 1
              
              # Try multiple patterns
              has_coauth = (
                  "co-authored-by:" in message.lower() or 
                  "co-authored-by" in message.lower() or
                  "coauthored" in message.lower()
              )
              
              if has_coauth:
                  engineers[key]["co_authored"] += 1
                  total_co_authored += 1
                  if len(sample_matches) < 3:
                      sample_matches.append((author, message[:100]))

          print(f"\n✅ Total commits: {total_commits}")
          print(f"✅ Co-authored commits: {total_co_authored}")
          print(f"✅ Adoption: {round((total_co_authored*100/total_commits), 1) if total_commits > 0 else 0}%")
          
          if sample_matches:
              print(f"\n✅ Sample co-authored commits:")
              for author, msg in sample_matches:
                  print(f"   - {author}: {msg[:80]}")

          if not engineers:
              print("No commits found")
              exit(0)

          sorted_eng = sorted(
              engineers.items(),
              key=lambda x: x[1]["co_authored"],
              reverse=True
          )

          def get_adoption_level(pct):
              if pct >= 80:
                  return "🔥 Expert"
              elif pct >= 60:
                  return "⭐ Advanced"
              elif pct >= 40:
                  return "📈 Proficient"
              elif pct >= 20:
                  return "🌱 Learning"
              else:
                  return "👋 New"

          def send_slack(blocks):
              try:
                  resp = requests.post(webhook, json={"blocks": blocks}, timeout=10)
                  return resp.status_code == 200
              except Exception as e:
                  print(f"Slack error: {e}")
                  return False

          overall_pct = round((total_co_authored * 100 / total_commits), 1) if total_commits > 0 else 0
          
          if overall_pct >= 20:
              team_status = "🎯 Excellent"
              color = "good"
          elif overall_pct >= 10:
              team_status = "📈 Good"
              color = "warning"
          else:
              team_status = "⚠️ Ramping"
              color = "danger"

          for i in range(0, len(sorted_eng), CHUNK_SIZE):
              chunk = sorted_eng[i:i + CHUNK_SIZE]
              blocks = []

              if i == 0:
                  blocks.append({
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": "📊 Claude Code Adoption Report"
                      }
                  })
                  
                  blocks.append({
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": f"*Team Status*\n{team_status}"
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Overall Adoption*\n{overall_pct}%"
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Total Commits*\n{total_commits}"
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Active Engineers*\n{len(sorted_eng)}"
                          }
                      ]
                  })
                  
                  blocks.append({"type": "divider"})

              for key, stats in chunk:
                  author, email = key.split("|||")
                  pct = round((stats["co_authored"] * 100 / stats["total"]), 1) if stats["total"] > 0 else 0
                  adoption_level = get_adoption_level(pct)
                  
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*{author}*\n{adoption_level}\nEmail: {email}\n• Total: {stats['total']} | Co-authored: {stats['co_authored']} ({pct}%)"
                      }
                  })

              blocks.append({
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": f"Updated: {__import__('datetime').datetime.now().strftime('%Y-%m-%d %H:%M UTC')}"
                      }
                  ]
              })

              if not send_slack(blocks):
                  print(f"Failed to post chunk {i//CHUNK_SIZE + 1}")
              
              time.sleep(0.5)

          print(f"\n✅ Report sent: {len(sorted_eng)} engineers, {overall_pct}% adoption")
          PYSCRIPT
