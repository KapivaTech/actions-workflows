name: Co-authored Commits Report

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests

      - name: Generate report and send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 << 'PYSCRIPT'
          import subprocess, requests, os, re
          from collections import defaultdict
          from datetime import datetime
          import time

          CHUNK_SIZE = 40
          webhook = os.getenv('SLACK_WEBHOOK_URL', '')
          if not webhook:
              print("SLACK_WEBHOOK_URL not set")
              exit(0)

          # Use --format with a commit-level separator (ASCII unit separator)
          # %x00 = null byte between commits so newlines inside %B don't break parsing
          raw = subprocess.check_output(
              ["git", "log", "--all", "--format=%x00%an%x01%ae%x01%B"],
              text=True
          )

          engineers = defaultdict(lambda: {"total": 0, "co_authored": 0, "email": ""})
          total_commits = 0
          total_co_authored = 0

          # Split on null byte — one entry per commit
          for entry in raw.split("\x00"):
              entry = entry.strip()
              if not entry:
                  continue

              parts = entry.split("\x01", 2)
              if len(parts) < 3:
                  continue

              author, email, body = parts[0].strip(), parts[1].strip(), parts[2]

              skip = ['dependabot[bot]', 'github-actions[bot]', 'coderabbitai[bot]']
              if not author or any(s in author for s in skip):
                  continue

              engineers[author]["total"] += 1
              engineers[author]["email"] = email
              total_commits += 1

              if re.search(r"co-authored-by", body, re.IGNORECASE):
                  engineers[author]["co_authored"] += 1
                  total_co_authored += 1

          print(f"Total commits: {total_commits}")
          print(f"Co-authored: {total_co_authored}")

          sorted_eng = sorted(engineers.items(), key=lambda x: x[1]["co_authored"], reverse=True)

          def level(pct):
              if pct >= 80: return "🔥 Expert"
              if pct >= 60: return "⭐ Advanced"
              if pct >= 40: return "📈 Proficient"
              if pct >= 20: return "🌱 Learning"
              return "👋 New"

          def send(blocks):
              r = requests.post(webhook, json={"blocks": blocks}, timeout=10)
              return r.status_code == 200

          overall_pct = round(total_co_authored * 100 / total_commits, 1) if total_commits else 0
          team_status = "🎯 Excellent" if overall_pct >= 20 else "📈 Good" if overall_pct >= 10 else "⚠️ Ramping"

          for i in range(0, len(sorted_eng), CHUNK_SIZE):
              chunk = sorted_eng[i:i + CHUNK_SIZE]
              blocks = []

              if i == 0:
                  blocks.append({"type": "header", "text": {"type": "plain_text", "text": "📊 Claude Code Adoption Report"}})
                  blocks.append({
                      "type": "section",
                      "fields": [
                          {"type": "mrkdwn", "text": f"*Team Status*\n{team_status}"},
                          {"type": "mrkdwn", "text": f"*Overall Adoption*\n{overall_pct}%"},
                          {"type": "mrkdwn", "text": f"*Total Commits*\n{total_commits}"},
                          {"type": "mrkdwn", "text": f"*Active Engineers*\n{len(sorted_eng)}"}
                      ]
                  })
                  blocks.append({"type": "divider"})

              for author, stats in chunk:
                  pct = round(stats["co_authored"] * 100 / stats["total"], 1) if stats["total"] else 0
                  email = stats["email"] if "noreply" not in stats["email"] else f"GitHub: {author}"
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*{author}*\n{level(pct)}\n{email}\n• Total: {stats['total']} | Co-authored: {stats['co_authored']} ({pct}%)"
                      }
                  })

              blocks.append({"type": "context", "elements": [{"type": "mrkdwn", "text": f"Updated: {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}"}]})
              send(blocks)
              time.sleep(0.5)

          print(f"✅ Done: {len(sorted_eng)} engineers, {overall_pct}% adoption")
          PYSCRIPT
