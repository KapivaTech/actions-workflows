name: Co-authored Commits Report

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK:
        required: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Generate report and send to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python3 << 'PYSCRIPT'
          import subprocess
          import requests
          from collections import defaultdict
          import time
          import re

          CHUNK_SIZE = 45

          # Get all commits
          log = subprocess.check_output(
              ["git", "log", "--all", "--pretty=format:%H|||%an|||%ae|||%B"],
              text=True
          )

          commits = [c for c in log.strip().split("\n") if c]
          engineers = defaultdict(lambda: {"total": 0, "co_authored": 0})
          total_commits = 0
          total_co_authored = 0

          # Parse commits
          for entry in commits:
              parts = entry.split("|||", 3)
              if len(parts) < 4:
                  continue
              
              _, author, email, message = parts
              key = f"{author}|||{email}"
              
              engineers[key]["total"] += 1
              total_commits += 1
              
              if re.search(r"co-authored-by:\s*", message, re.IGNORECASE):
                  engineers[key]["co_authored"] += 1
                  total_co_authored += 1

          # Sort by co-authored
          sorted_eng = sorted(
              engineers.items(),
              key=lambda x: x[1]["co_authored"],
              reverse=True
          )

          webhook = "${SLACK_WEBHOOK}"
          if not webhook:
              print("ERROR: Missing SLACK_WEBHOOK")
              exit(1)

          def send_slack(blocks):
              resp = requests.post(webhook, json={"blocks": blocks})
              if resp.status_code != 200:
                  print(f"Slack error: {resp.text}")
                  return False
              return True

          overall_pct = round((total_co_authored * 100 / total_commits), 1) if total_commits > 0 else 0

          # Send in chunks
          for i in range(0, len(sorted_eng), CHUNK_SIZE):
              chunk = sorted_eng[i:i + CHUNK_SIZE]
              blocks = []

              if i == 0:
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*Claude Code Adoption Report*\n\nTotal Commits: {total_commits}\nCo-authored: {total_co_authored} ({overall_pct}%)\nEngineers: {len(sorted_eng)}"
                      }
                  })
                  blocks.append({"type": "divider"})

              for key, stats in chunk:
                  author, email = key.split("|||")
                  pct = round((stats["co_authored"] * 100 / stats["total"]), 1) if stats["total"] > 0 else 0
                  
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*{author}*\nEmail: {email}\nTotal: {stats['total']} | Co-authored: {stats['co_authored']} ({pct}%)"
                      }
                  })

              if not send_slack(blocks):
                  exit(1)
              
              time.sleep(0.5)

          print("✅ Report sent successfully")
          PYSCRIPT
