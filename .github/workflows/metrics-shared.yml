name: Co-authored Commits Report

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Generate report and send to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import subprocess
          import requests
          from collections import defaultdict
          import time

          # Slack safe chunk size (max ~50 blocks)
          CHUNK_SIZE = 45

          # --- FETCH GIT LOG ---
          try:
              log = subprocess.check_output(
                  ["git", "log", "--pretty=format:%H%x1f%an%x1f%ae%x1f%B"],
                  text=True
              )
          except subprocess.CalledProcessError as e:
              print("Git log failed:", e)
              exit(1)

          commits = log.strip().split("\n") if log else []

          engineers = defaultdict(lambda: {
              "total_commits": 0,
              "co_authored_commits": 0
          })

          total_commits = 0
          total_co_authored = 0

          # --- PARSE COMMITS ---
          for entry in commits:
              try:
                  _, author, email, message = entry.split("\x1f", 3)
              except ValueError:
                  continue

              key = f"{author}|||{email}"

              engineers[key]["total_commits"] += 1
              total_commits += 1

              if "Co-authored-by:" in message:
                  engineers[key]["co_authored_commits"] += 1
                  total_co_authored += 1

          # --- SORT ENGINEERS ---
          sorted_engineers = sorted(
              engineers.items(),
              key=lambda x: x[1]["co_authored_commits"],
              reverse=True
          )

          webhook = "${SLACK_WEBHOOK}"

          if not webhook:
              print("Missing Slack webhook")
              exit(1)

          def send_to_slack(blocks):
              for attempt in range(3):  # retry logic
                  res = requests.post(webhook, json={"blocks": blocks})
                  if res.status_code == 200:
                      return
                  print(f"Slack error (attempt {attempt+1}):", res.text)
                  time.sleep(2)
              exit(1)

          overall_pct = round(
              (total_co_authored * 100 / total_commits), 1
          ) if total_commits > 0 else 0

          # --- CHUNK + SEND ---
          for i in range(0, len(sorted_engineers), CHUNK_SIZE):
              chunk = sorted_engineers[i:i + CHUNK_SIZE]

              blocks = []

              # Header only in first message
              if i == 0:
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*Co-authored Commits Report*\n\n"
                                  f"Total Commits: {total_commits}\n"
                                  f"Co-authored Commits: {total_co_authored} ({overall_pct}%)\n"
                                  f"Total Engineers: {len(sorted_engineers)}"
                      }
                  })
                  blocks.append({"type": "divider"})

              for key, stats in chunk:
                  author, email = key.split("|||")

                  total = stats["total_commits"]
                  co_auth = stats["co_authored_commits"]

                  pct = round((co_auth * 100 / total), 1) if total > 0 else 0

                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": (
                              f"*{author}*\n"
                              f"Email: {email}\n"
                              f"Total: {total} | Co-authored: {co_auth} ({pct}%)"
                          )
                      }
                  })

              send_to_slack(blocks)

              # small delay to avoid rate limiting
              time.sleep(1)

          print("✅ Full report sent for ALL engineers")
          EOF
